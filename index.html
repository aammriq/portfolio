
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Desain Profesional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 text-gray-900">
    <nav class="p-6 bg-white shadow-sm">
        <h1 class="text-2xl font-bold text-center">Portfolio Desain</h1>
    </nav>

    <main class="container mx-auto p-6 space-y-12">
        <!-- Desain Logo Section -->
        <section>
            <h2 class="text-3xl font-bold mb-6 text-indigo-700">Desain Logo</h2>
            <div class="grid md:grid-cols-2 gap-8">
                <div class="bg-white p-4 rounded-lg shadow-md">
                    <img src="assets/desain_logo_vector.png" alt="Desain Logo Vector" class="w-full h-64 object-contain rounded">
                    <p class="mt-2 text-center font-semibold">Versi Vector</p>
                </div>
                <div class="bg-white p-4 rounded-lg shadow-md">
                    <img src="assets/desain_logo_reklame.png" alt="Logo di Reklame" class="w-full h-64 object-cover rounded">
                    <p class="mt-2 text-center font-semibold">Realpict Papan Reklame</p>
                </div>
            </div>
        </section>

        <!-- Packaging Design Section -->
        <section>
            <h2 class="text-3xl font-bold mb-6 text-indigo-700">Packaging Design</h2>
            <div class="bg-white p-4 rounded-lg shadow-md w-full md:w-1/2 mx-auto">
                <img src="assets/desain_kemasan.jpg" alt="Packaging Design" class="w-full h-80 object-cover rounded">
                <p class="mt-2 text-center font-semibold">Desain Kemasan Produk</p>
            </div>
        </section>

        <!-- Sticker Section -->
        <section>
            <h2 class="text-3xl font-bold mb-6 text-indigo-700">Sticker Design</h2>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-6">
                <img src="assets/sticker_1.jpg" alt="Sticker 1" class="w-full h-48 object-cover rounded shadow">
                <img src="assets/sticker_2.jpg" alt="Sticker 2" class="w-full h-48 object-cover rounded shadow">
                <img src="assets/sticker_3.jpg" alt="Sticker 3" class="w-full h-48 object-cover rounded shadow">
            </div>
        </section>

        <!-- Branding Package Section -->
        <section>
            <h2 class="text-3xl font-bold mb-6 text-indigo-700">Paket Branding</h2>
            <div class="bg-indigo-900 text-white p-8 rounded-lg shadow-lg">
                <h3 class="text-xl font-bold">Layanan Branding Premium</h3>
                <p class="mt-2">Kami menciptakan identitas visual yang kohesif untuk bisnis Anda, mulai dari palet warna hingga tipografi.</p>
            </div>
        </section>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
